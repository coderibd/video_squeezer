[package]
name = "video-squeezer"
version = "0.3.1"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
eframe = "0.31.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
