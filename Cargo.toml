[package]
name = "video-squeezer"
version = "2.1.0"
edition = "2021"
build = "build.rs"
description = "A macOS-first desktop application for compressing large video libraries with FFmpeg."
license = "MIT"
keywords = ["video", "ffmpeg", "macos", "compression", "slint"]
categories = ["multimedia::video", "gui"]
publish = false

[dependencies]
anyhow = "1.0"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "=1.17.1"
walkdir = "2.5"

[build-dependencies]
slint-build = "=1.17.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 1
