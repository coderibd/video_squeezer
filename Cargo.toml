[package]
name = "video-squeezer"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1.0"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.16.0"
walkdir = "2.5"

[build-dependencies]
slint-build = "1.16.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
